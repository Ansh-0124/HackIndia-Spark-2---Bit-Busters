<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="index.css">
    <link rel="icon" type="Image/png" href="logo.png">
    
    <!-- AOS Animation CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <title>कलाᧁꫝꪖ᥅ | Create NFT</title>
</head>

<body class="bg-slate-900 text-slate-100 antialiased selection:bg-purple-500 selection:text-white">
    <!-- Navigation -->
    <nav class="glass-nav fixed w-full z-50 top-0 transition-all duration-300 shadow-lg shadow-purple-900/10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center gap-3 cursor-pointer">
                    <a href="index.html" class="flex items-center gap-3">
                        <img class="h-12 w-12 rounded-xl border border-purple-500/30 shadow-lg shadow-purple-500/20" src="WhatsApp Image 2024-08-06 at 22.34.55 copy.jpeg" alt="KalaGhar Logo">
                        <span class="font-bold text-2xl tracking-tight text-white">कलाᧁꫝꪖ᥅</span>
                    </a>
                </div>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-slate-300 hover:text-purple-400 font-medium transition-colors">Home</a>
                    <a href="gallery.html" class="text-slate-300 hover:text-purple-400 font-medium transition-colors">Marketplace</a>
                    <a href="mint.html" class="protected-nav hidden text-white hover:text-purple-400 font-medium transition-colors">Create</a>
                    <a href="aboutus.html" class="text-slate-300 hover:text-purple-400 font-medium transition-colors">About Us</a>
                    <a href="profile.html" class="protected-nav hidden text-slate-300 hover:text-purple-400 font-medium transition-colors">Profile</a>
                </div>

                <!-- Auth Buttons -->
                <div class="hidden md:flex items-center space-x-4">
                    <a href="#" class="connect-wallet-btn btn-primary px-6 py-2 rounded-full font-medium shadow-lg transition-all duration-300">Connect Wallet</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header Section -->
    <section class="pt-32 pb-8 relative overflow-hidden">
        <div class="absolute top-0 left-1/4 w-96 h-96 bg-purple-600/10 rounded-full blur-[120px]"></div>
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10 text-center" data-aos="fade-down">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Create New <span class="text-gradient">NFT</span></h1>
            <p class="text-slate-400 text-lg">Mint your digital artwork to the blockchain and list it on the KalaGhar marketplace.</p>
        </div>
    </section>

    <!-- Minting Form -->
    <section class="py-8 min-h-screen relative z-10">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="glass-card p-8 md:p-12 relative overflow-hidden" data-aos="fade-up">
                <form id="mint-form" class="space-y-8">
                    
                    <!-- Image Upload -->
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Upload Artwork</label>
                        <div class="flex items-center justify-center w-full">
                            <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-64 border-2 border-slate-700 border-dashed rounded-xl cursor-pointer bg-slate-800/50 hover:bg-slate-800/80 hover:border-purple-500 transition-all group">
                                <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center" id="upload-content">
                                    <i class="fas fa-cloud-upload-alt text-4xl text-slate-500 mb-3 group-hover:text-purple-400 transition-colors"></i>
                                    <p class="mb-2 text-sm text-slate-400"><span class="font-semibold text-white">Click to upload</span> or drag and drop</p>
                                    <p class="text-xs text-slate-500">SVG, PNG, JPG or GIF (MAX. 800x400px)</p>
                                </div>
                                <div id="preview-container" class="hidden w-full h-full p-2">
                                    <img id="image-preview" class="w-full h-full object-contain rounded-lg" src="" alt="Preview">
                                </div>
                                <input id="dropzone-file" type="file" class="hidden" accept="image/*" />
                            </label>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-6">
                            <div>
                                <label for="nft-title" class="block text-sm font-medium text-slate-300 mb-2">Item Name</label>
                                <input type="text" id="nft-title" required class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors" placeholder="e.g. 'Cyberpunk Dreamscape'">
                            </div>
                            
                            <div>
                                <label for="nft-price" class="block text-sm font-medium text-slate-300 mb-2">Price (ETH)</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                                        <i class="fab fa-ethereum text-purple-400"></i>
                                    </div>
                                    <input type="number" id="nft-price" step="0.01" required class="w-full bg-slate-800/50 border border-slate-700 rounded-lg pl-10 pr-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors" placeholder="0.5">
                                </div>
                            </div>
                        </div>

                        <div>
                            <label for="nft-desc" class="block text-sm font-medium text-slate-300 mb-2">Description</label>
                            <textarea id="nft-desc" rows="5" required class="w-full bg-slate-800/50 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 transition-colors resize-none" placeholder="Provide a detailed description of your item."></textarea>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-slate-700">
                        <button type="submit" id="mint-btn" class="w-full md:w-auto px-8 btn-primary py-3 rounded-lg font-bold text-lg">
                            <i class="fas fa-hammer mr-2"></i> Mint to Blockchain
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-900/50 mt-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <p class="text-base text-slate-400">
                    &copy; 2024 <span class="font-bold">कलाᧁꫝꪖ᥅™</span>. All rights reserved.
                </p>
            </div>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="wallet.js"></script>
    <script>
        AOS.init({ once: true });

        // Security check - redirect if no wallet
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if(localStorage.getItem('walletConnected') !== 'true') {
                    alert("You must connect your wallet to mint an NFT.");
                    window.location.href = "index.html";
                }
            }, 500);
        });

        // Image Preview Logic
        const fileInput = document.getElementById('dropzone-file');
        const uploadContent = document.getElementById('upload-content');
        const previewContainer = document.getElementById('preview-container');
        const imagePreview = document.getElementById('image-preview');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    uploadContent.classList.add('hidden');
                    previewContainer.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        });

        // Form Submit Simulation
        document.getElementById('mint-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = document.getElementById('mint-btn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Confirming Transaction...';
            btn.classList.add('opacity-75', 'cursor-not-allowed');
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<i class="fas fa-check mr-2"></i> Minted Successfully!';
                btn.classList.remove('btn-primary');
                btn.classList.add('bg-green-600', 'text-white');
                
                alert("Your NFT has been minted and added to the KalaGhar smart contract!");
                window.location.href = "profile.html";
            }, 2500);
        });
    </script>
</body>
</html>
